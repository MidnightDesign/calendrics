php-version = "8.4"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = ["tests/Test262/scripts"]

[linter]
integrations = ["phpunit"]

[linter.rules.assertion-style]
level = "error"

[linter.rules.literal-named-argument]
level = "error"

[linter.rules.prefer-early-continue]
level = "error"

# PlainDateTime/ZonedDateTime test suites require 100+ test methods because each
# virtual property, method, and option path per the TC39 spec must be covered.
# ZonedDateTime is inherently the most complex class per the spec (29 properties,
# 25+ methods plus a full disambiguation/offset-option/calendar matrix).
[linter.rules.too-many-methods]
level = "error"
threshold = 140

# PlainDate has 13+ virtual properties; PlainDateTime has 22 (9 time fields + 13 calendar)
# ZonedDateTime has 29 (3 stored + 1 private cache + 25 virtual properties per TC39 spec)
[linter.rules.too-many-properties]
level = "error"
threshold = 35

# Spec\Duration now carries the highest class-level cyclomatic complexity (just under
# 250); PlainDateTime dropped to ~146 when its parse/bag/add/diff engines moved into
# Temporal\Spec\Internal\ collaborators, the same move that earlier brought Duration and
# ZonedDateTime down from near 700 — so treat this as a ratchet, not a ceiling: it
# should only ever move down.
[linter.rules.cyclomatic-complexity]
level = "warning"
threshold = 250

# Kan-defect measures control-flow density; the highest remaining score is just under 15
# (IntlCalendarBridge), again on the classes that still hold a full TC39 algorithm
# inline. Same ratchet rule as above.
[linter.rules.kan-defect]
level = "warning"
threshold = 15.0

# Duration.assertDuration-style test helpers assert all 10 Duration fields in a
# single call; ZonedDateTime::with() accepts 13 TC39-spec date/time/calendar
# fields plus 3 option enums; ZonedFields::fromLocal() receives the full 6-field
# local date/time plus timezone, calendar and disambiguation. These are inherent
# to the TC39 spec and cannot be split without making the call sites worse.
[linter.rules.excessive-parameter-list]
level = "warning"
threshold = 16

# Halstead volumes/effort are dominated by the TC39 parsing, add/subtract, and
# round/diff algorithms in PlainDateTime and in the Temporal\Spec\Internal\
# collaborators, which must handle all 10 duration fields × 9 rounding modes ×
# signed paths in one call.
# Thresholds are sized to accommodate spec-level algorithms without masking
# genuinely out-of-control methods.
[linter.rules.halstead]
level = "warning"
volume-threshold = 12000
effort-threshold = 250000
difficulty-threshold = 22
